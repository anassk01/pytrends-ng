[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytrends-ng"
dynamic = ["version"]
description = "Drop-in replacement for the archived pytrends: Google Trends without 429 errors, unlimited keywords on one scale."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = ["pandas>=1.1", "requests>=2.20"]
keywords = ["pytrends", "google trends", "google trends api", "trends", "seo", "keyword research"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Internet :: WWW/HTTP", "Intended Audience :: Developers"]

[project.urls]
"Google Trends actor" = "https://apify.com/githubanassk/google-trends-scraper"

[tool.hatch.version]
path = "pytrends_ng/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pytrends_ng"]
